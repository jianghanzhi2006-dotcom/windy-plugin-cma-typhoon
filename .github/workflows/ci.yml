name: ci

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm
            - name: Install locked dependencies
              run: npm ci
            - name: Run logic tests
              run: npm test
            - name: Type-check TypeScript modules
              run: npm run typecheck
            - name: Build the distributable
              run: npm run build
